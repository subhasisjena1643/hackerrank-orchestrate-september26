[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"code/evaluation/*.py" = ["E402"]
"code/scripts/*.py" = ["E402"]
"code/tests/*.py" = ["E402"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["code/buy_or_wait"]
